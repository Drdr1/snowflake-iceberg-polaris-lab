name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  local:
    name: Iceberg tests (local SQL catalog)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -v

  stack:
    name: Polaris + MinIO + Spark interop
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Start MinIO + Polaris
        run: docker compose up -d --wait

      - name: Show versions
        run: |
          docker compose images
          curl -s http://localhost:8182/q/health

      - name: Bootstrap catalog and roles
        run: bash polaris/bootstrap.sh

      - name: Bootstrap is idempotent
        run: bash polaris/bootstrap.sh

      - run: pip install -r requirements.txt -r requirements-spark.txt

      - name: Same Iceberg tests, now against Polaris REST + MinIO
        env:
          LAB_CATALOG: rest
        run: python -m pytest -v -m "not spark"

      - name: Spark <-> PyIceberg interop through Polaris
        env:
          LAB_CATALOG: rest
          LAB_SPARK: "1"
        run: python -m pytest -v -m spark -rs

      - name: Demo table end to end (create -> evolve -> maintain), then cross-check
        env:
          LAB_CATALOG: rest
        run: |
          python -m spark.load_demo --step all | tee demo.log
          echo "current metadata file:"; python -m lab.locate lab.orders
          spark_fp=$(grep '^snowflake compare string:' demo.log | tail -1 | cut -d: -f2 | tr -d ' ')
          python -m lab.compare lab.orders --snowflake "$spark_fp"

      - name: Read-only principal cannot write
        run: bash polaris/check_reader.sh

      - name: Polaris logs
        if: failure()
        run: docker compose logs --no-color polaris | tail -300
