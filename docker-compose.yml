# Local stand-in for the AWS side: RustFS plays S3, Apache Polaris is the
# Iceberg REST catalog. Spark and PyIceberg run on the host and talk to both.
#
# Based on Apache Polaris' own RustFS guide (site/content/guides/rustfs).
# (MinIO's public container images are no longer pullable, hence RustFS.)
# Credentials below are lab-only defaults; never reuse them anywhere real.

services:
  rustfs:
    image: rustfs/rustfs:${RUSTFS_TAG:-1.0.0-alpha.80}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # console
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://127.0.0.1:9000/health"]
      interval: 3s
      timeout: 10s
      retries: 30
      start_period: 10s

  create-bucket:
    image: amazon/aws-cli:2.34.9
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      AWS_ENDPOINT_URL: http://rustfs:9000
      AWS_REGION: us-west-2
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        (aws s3api head-bucket --bucket lakehouse 2>/dev/null || aws s3 mb s3://lakehouse) &&
        aws s3 ls && echo bucket ready

  polaris:
    image: apache/polaris:${POLARIS_VERSION:-latest}
    ports:
      - "8181:8181"   # Iceberg REST + management API
      - "8182:8182"   # health / metrics
    depends_on:
      rustfs:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully
    environment:
      AWS_REGION: us-west-2
      # Polaris uses these to vend scoped credentials to engines,
      # the same mechanism Snowflake uses with VENDED_CREDENTIALS.
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      POLARIS_BOOTSTRAP_CREDENTIALS: POLARIS,root,s3cr3t
      polaris.realm-context.realms: POLARIS
      quarkus.otel.sdk.disabled: "true"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8182/q/health"]
      interval: 2s
      timeout: 10s
      retries: 60
      start_period: 10s
